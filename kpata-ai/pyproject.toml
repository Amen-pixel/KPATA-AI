[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kpata"
version = "0.1.0"
description = "Kpata AI - agent vocal de création publicitaire en Yorùbá et Hausa (AMA PIIA C2)"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
# Les tests « slow » téléchargent un vrai modèle (plusieurs Go) : ils ne
# tournent pas par défaut. Pour les lancer : pytest -m slow
addopts = "-m 'not slow'"
markers = [
    "slow: a besoin d'un vrai modele (telechargement). Exclu par defaut.",
]
